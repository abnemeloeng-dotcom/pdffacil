name: Gerar APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Montar projeto
        run: bash gerar-projeto.sh
      - name: Compilar
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PDFFacil.apk
          gh release create "v${{ github.run_number }}" PDFFacil.apk --title "PDFFácil v${{ github.run_number }}" --notes "APK do PDFFácil." --latest
